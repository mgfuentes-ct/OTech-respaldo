<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8000;">
    <title>Crear Producto - OTech MXD</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        /* Estilos adicionales específicos de crear-producto que no están en style.css */
        .compatibles-box {
            padding: 20px;
            background: var(--bg-glass);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            backdrop-filter: blur(10px);
        }

        .help-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-grid .full {
            grid-column: 1 / -1;
        }

        .actions {
            display: flex;
            gap: 14px;
            margin-top: 28px;
        }

        .actions button,
        .actions .back-link {
            width: 100%;
            margin-top: 0;
        }

        .actions .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            border-radius: 12px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--border-soft);
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .actions .back-link:hover {
            background: rgba(99, 102, 241, 0.2);
            text-shadow: none;
        }

        .checkbox-card.checked {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
        }

        main.container {
            max-width: 820px;
        }

        @media (max-width: 720px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Inventario OTech / MXD</a>
    </nav>

    <main class="container">
        <h1>Crear Nuevo Producto</h1>
        <p class="subtitle">Registra productos por marca, tipo y compatibilidad con modelos.</p>

        <div class="form-grid">
            <div class="form-group">
                <label for="codigo-producto">Código / Número de parte *</label>
                <input type="text" id="codigo-producto" placeholder="Ej: 982746220083">
            </div>

            <div class="form-group">
                <label for="nombre-producto">Nombre del producto *</label>
                <input type="text" id="nombre-producto" placeholder="Ej: Batería inteligente">
            </div>

            <div class="form-group">
                <label for="marca-producto">Marca *</label>
                <select id="marca-producto">
                    <option value="">Cargando marcas...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipo-producto">Tipo de producto *</label>
                <select id="tipo-producto">
                    <option value="">Cargando tipos...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="modelo-base">Modelo base</label>
                <select id="modelo-base">
                    <option value="">Selecciona una marca primero</option>
                </select>
                <p class="help-text">Úsalo si el producto pertenece principalmente a un modelo.</p>
            </div>

            <div class="form-group">
                <label for="stock-minimo">Stock mínimo *</label>
                <input type="number" id="stock-minimo" min="0" placeholder="Ej: 10">
            </div>

            <div class="form-group full">
                <label for="descripcion-producto">Descripción</label>
                <textarea id="descripcion-producto"
                    placeholder="Ej: Batería compatible con drones MXD700 y MXD800"></textarea>
            </div>

            <div class="form-group full">
                <div class="compatibles-box">
                    <label>Modelos compatibles</label>
                    <p class="help-text">Selecciona todos los modelos a los que les sirve este producto.</p>
                    <div id="modelos-compatibles" class="checkbox-grid">
                        <p class="help-text">Selecciona una marca para cargar modelos.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <a href="index.html" class="back-link">← Volver</a>
            <button id="btn-guardar" onclick="registrarNuevoProducto()">Guardar Producto</button>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:8000';

        document.addEventListener('DOMContentLoaded', async () => {
            await cargarMarcas();
            await cargarTiposProducto();

            document.getElementById('marca-producto').addEventListener('change', async () => {
                await cargarModelosPorMarca();
            });
        });

        async function cargarMarcas() {
            const select = document.getElementById('marca-producto');

            try {
                const res = await axios.get(`${API_URL}/catalogos/marcas`);
                select.innerHTML = '<option value="">Selecciona una marca</option>';

                res.data.forEach(marca => {
                    const option = document.createElement('option');
                    option.value = marca.id_marca;
                    option.textContent = marca.nombre;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error(error);
                select.innerHTML = '<option value="">Error al cargar marcas</option>';
            }
        }

        async function cargarTiposProducto() {
            const select = document.getElementById('tipo-producto');

            try {
                const res = await axios.get(`${API_URL}/catalogos/tipos_producto`);
                select.innerHTML = '<option value="">Selecciona un tipo</option>';

                res.data.forEach(tipo => {
                    const option = document.createElement('option');
                    option.value = tipo.id_tipo_producto;
                    option.textContent = tipo.nombre;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error(error);
                select.innerHTML = '<option value="">Error al cargar tipos</option>';
            }
        }

        async function cargarModelosPorMarca() {
            const idMarca = document.getElementById('marca-producto').value;
            const modeloBaseSelect = document.getElementById('modelo-base');
            const compatiblesDiv = document.getElementById('modelos-compatibles');

            modeloBaseSelect.innerHTML = '<option value="">Selecciona modelo base</option>';
            compatiblesDiv.innerHTML = '';

            if (!idMarca) {
                modeloBaseSelect.innerHTML = '<option value="">Selecciona una marca primero</option>';
                compatiblesDiv.innerHTML = '<p class="help-text">Selecciona una marca para cargar modelos.</p>';
                return;
            }

            try {
                const res = await axios.get(`${API_URL}/catalogos/modelos`, {
                    params: { id_marca: idMarca }
                });

                if (res.data.length === 0) {
                    modeloBaseSelect.innerHTML = '<option value="">No hay modelos registrados</option>';
                    compatiblesDiv.innerHTML = '<p class="help-text">No hay modelos registrados para esta marca.</p>';
                    return;
                }

                res.data.forEach(modelo => {
                    const option = document.createElement('option');
                    option.value = modelo.id_modelo;
                    option.textContent = modelo.nombre;
                    modeloBaseSelect.appendChild(option);

                    const label = document.createElement('label');
                    label.className = 'checkbox-card';

                    label.innerHTML = `
                        <input type="checkbox" value="${modelo.id_modelo}">
                        <span>${modelo.nombre}</span>
                    `;

                    const checkbox = label.querySelector('input');
                    checkbox.addEventListener('change', () => {
                        label.classList.toggle('checked', checkbox.checked);
                    });

                    compatiblesDiv.appendChild(label);
                });
            } catch (error) {
                console.error(error);
                modeloBaseSelect.innerHTML = '<option value="">Error al cargar modelos</option>';
                compatiblesDiv.innerHTML = '<p class="help-text">Error al cargar modelos.</p>';
            }
        }

        async function registrarNuevoProducto() {
            const codigo = document.getElementById('codigo-producto').value.trim();
            const nombre = document.getElementById('nombre-producto').value.trim();
            const descripcion = document.getElementById('descripcion-producto').value.trim();
            const idMarca = document.getElementById('marca-producto').value;
            const idTipoProducto = document.getElementById('tipo-producto').value;
            const idModeloBase = document.getElementById('modelo-base').value;
            const stockMinimo = document.getElementById('stock-minimo').value.trim();

            const modelosCompatibles = Array.from(
                document.querySelectorAll('#modelos-compatibles input[type="checkbox"]:checked')
            ).map(cb => parseInt(cb.value));

            if (!codigo || !nombre || !idMarca || !idTipoProducto || stockMinimo === '') {
                Swal.fire('Campos incompletos', 'Completa los campos obligatorios.', 'warning');
                return;
            }

            if (parseInt(stockMinimo) < 0) {
                Swal.fire('Dato inválido', 'El stock mínimo no puede ser negativo.', 'warning');
                return;
            }

            const btn = document.getElementById('btn-guardar');
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                const response = await axios.post(`${API_URL}/admin/crear_producto`, {
                    codigo_original: codigo,
                    nombre: nombre,
                    descripcion: descripcion || null,
                    stock_minimo: parseInt(stockMinimo),
                    id_marca: parseInt(idMarca),
                    id_tipo_producto: parseInt(idTipoProducto),
                    id_modelo: idModeloBase ? parseInt(idModeloBase) : null,
                    modelos_compatibles: modelosCompatibles
                });

                Swal.fire({
                    icon: 'success',
                    title: '¡Producto registrado!',
                    text: response.data.mensaje,
                    confirmButtonColor: '#163f97'
                }).then(() => {
                    window.location.href = 'index.html';
                });

            } catch (error) {
                console.error(error);

                let mensaje = 'No se pudo registrar el producto.';

                if (error.response?.data?.detail) {
                    if (Array.isArray(error.response.data.detail)) {
                        mensaje = error.response.data.detail.map(e => e.msg).join(', ');
                    } else {
                        mensaje = error.response.data.detail;
                    }
                }

                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: mensaje,
                    confirmButtonColor: '#ef4444'
                });

            } finally {
                btn.disabled = false;
                btn.textContent = 'Guardar Producto';
            }
        }
    </script>
    <script src="theme.js"></script>
</body>

</html>
