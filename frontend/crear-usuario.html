<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8000;">
    <title>Crear Usuario - OTech</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="img/Logo 1 OTECH-Photoroom.png" alt="OTech Logo" style="display: block; margin: 0 auto 20px auto; width: 60px;">
            <a href="index.html" class="navbar-brand">OTech inventario</a>
        </div>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 40px;">Crear Nuevo Usuario</h1>
        
        <div class="grid-form">
            <div class="form-group">
                <label for="admin-nombre">Nombre completo</label>
                <input type="text" id="admin-nombre" placeholder="Ej: Juan Pérez" required>
                <small class="validation-msg" id="error-nombre">Ingresa el nombre completo</small>
            </div>
            <div class="form-group">
                <label for="admin-usuario">Nombre de usuario</label>
                <input type="text" id="admin-usuario" placeholder="Ej: juanp" required>
                <small class="validation-msg" id="error-usuario">Ingresa el nombre del usuario</small>
            </div>
            <div class="form-group full-width">
                <label for="admin-email">Correo electrónico</label>
                <input type="email" id="admin-email" placeholder="Ej: juan@otech.com" required>
                <small class="validation-msg" id="error-email">Formato de correo inválido</small>
            </div>
            <div class="form-group">
                <label for="admin-password">Contraseña</label>
                <input type="password" id="admin-password" placeholder="Mínimo 6 caracteres" required>
                <small class="validation-msg" id="error-password">La contraseña debe tener al menos 6 caracteres</small>
            </div>
            <div class="form-group">
                <label for="admin-password-confirm">Confirmar contraseña</label>
                <input type="password" id="admin-password-confirm" placeholder="Repite la contraseña" required>
                <small class="validation-msg" id="error-password-confirm">Las contraseñas no coinciden</small>
            </div>
        </div>

        <div class="full-width" style="margin-top: 20px;">
            <button onclick="registrarNuevoUsuario()" style="max-width: 300px; margin: 0 auto; display: block;">Guardar Usuario</button>
            <div style="text-align: center;">
                <a href="index.html" class="back-link">← Volver al Inventario</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8000';

        // Lógica de validación instantánea
        function checkInput(inputId, errorId, condition) {
            const input = document.getElementById(inputId);
            const errorLabel = document.getElementById(errorId);
            input.addEventListener('input', () => {
                if (!condition(input.value)) {
                    input.classList.add('invalid');
                } else {
                    input.classList.remove('invalid');
                }
            });
        }

        checkInput('admin-nombre', 'error-nombre', v => v.trim().length > 0);
        checkInput('admin-usuario', 'error-usuario', v => v.trim().length > 0);
        checkInput('admin-email', 'error-email', v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()));
        checkInput('admin-password', 'error-password', v => v.length >= 6);
        checkInput('admin-password-confirm', 'error-password-confirm', v => v === document.getElementById('admin-password').value);

        // Re-checkear confirm pass cuando el pass original cambia
        document.getElementById('admin-password').addEventListener('input', () => {
            const conf = document.getElementById('admin-password-confirm');
            if (conf.value) {
                if (conf.value !== document.getElementById('admin-password').value) {
                    conf.classList.add('invalid');
                } else {
                    conf.classList.remove('invalid');
                }
            }
        });


        async function registrarNuevoUsuario() {
            const nombreCompleto = document.getElementById('admin-nombre').value.trim();
            const nombreUsuario = document.getElementById('admin-usuario').value.trim();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            const passwordConfirm = document.getElementById('admin-password-confirm').value.trim();

            const inputs = ['admin-nombre', 'admin-usuario', 'admin-email', 'admin-password', 'admin-password-confirm'];
            let hasErrors = false;
            
            // Simular evento input en todos para forzar validacion manual si intentan hacer submit en vacio
            inputs.forEach(id => {
                const el = document.getElementById(id);
                el.dispatchEvent(new Event('input'));
                if (el.classList.contains('invalid') || !el.value.trim()) { 
                    if (!el.value.trim()) el.classList.add('invalid');
                    hasErrors = true; 
                }
            });

            if (hasErrors) {
                Swal.fire({icon: 'warning', title: 'Campos incompletos', text: 'Corrige los errores marcados en rojo.', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000});
                return;
            }

            try {
                const response = await axios.post(`${API_URL}/admin/crear_usuario`, null, {
                    params: {
                        nombre_completo: nombreCompleto,
                        nombre_usuario: nombreUsuario,
                        email: email,
                        password: password
                    }
                });
                Swal.fire({
                    title: '¡Éxito!',
                    text: response.data.mensaje,
                    icon: 'success',
                    confirmButtonText: 'Aceptar'
                }).then(() => {
                    window.location.href = 'index.html';
                });
            } catch (error) {
                let mensaje = "Error al registrar usuario.";
                if (error.response?.data?.detail) {
                    mensaje = error.response.data.detail;
                }
                Swal.fire('Error', mensaje, 'error');
            }
        }
    </script>
    <script src="theme.js"></script>
</body>
</html>
