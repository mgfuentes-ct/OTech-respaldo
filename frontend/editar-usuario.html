<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' ; connect-src 'self' http://localhost:8000;">
    <title>Editar Usuario - OTech</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Inventario OTech / MXD</a>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 40px;">Editar Usuario</h1>

        <div class="grid-form">
            <div class="form-group">
                <label for="nombre-completo">Nombre completo</label>
                <input type="text" id="nombre-completo" placeholder="Ej: Juan Pérez" required>
            </div>
            <div class="form-group">
                <label for="nombre-usuario">Nombre de usuario</label>
                <input type="text" id="nombre-usuario" placeholder="Ej: juanp" required>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="Ej: juan@otech.com" required>
            </div>
            <div class="form-group">
                <label for="rol">Rol</label>
                <select id="rol" required>
                    <option value="Operario">Operario</option>
                    <option value="Admin">Administrador</option>
                </select>
            </div>
        </div>

        <div class="full-width" style="margin-top: 20px;">
            <button onclick="guardarEdicion()" style="max-width: 300px; margin: 0 auto; display: block;">Guardar
                Cambios</button>
            <div style="text-align: center;">
                <a href="index.html" class="back-link">← Volver al Inventario</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8000';
        const urlParams = new URLSearchParams(window.location.search);
        const idUsuario = urlParams.get('id');

        if (!idUsuario) {
            Swal.fire('Error', 'ID de usuario no especificado.', 'error').then(() => {
                window.location.href = 'index.html';
            });
        }

        // Cargar datos del usuario
        async function cargarUsuario() {
            try {
                const response = await axios.get(`${API_URL}/admin/obtener_usuario/${idUsuario}`);
                const usuario = response.data;

                document.getElementById('nombre-completo').value = usuario.nombre_completo || '';
                document.getElementById('nombre-usuario').value = usuario.nombre_usuario || '';
                document.getElementById('email').value = usuario.email || '';
                document.getElementById('rol').value = usuario.rol || 'Operario';
            } catch (error) {
                Swal.fire('Error', 'No se pudo cargar el usuario.', 'error').then(() => {
                    window.location.href = 'index.html';
                });
            }
        }

        // Guardar edición
        async function guardarEdicion() {
            const nombreCompleto = document.getElementById('nombre-completo').value.trim();
            const nombreUsuario = document.getElementById('nombre-usuario').value.trim();
            const email = document.getElementById('email').value.trim();
            const rol = document.getElementById('rol').value;

            // Validaciones
            if (!nombreCompleto || !nombreUsuario || !email) {
                Swal.fire('Error', 'Por favor, completa todos los campos.', 'error');
                return;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                Swal.fire('Error', 'Formato de correo inválido.', 'error');
                return;
            }

            try {
                await axios.put(`${API_URL}/admin/editar_usuario/${idUsuario}`, null, {
                    params: { nombre_completo: nombreCompleto, nombre_usuario: nombreUsuario, email: email, rol: rol }
                });

                Swal.fire({
                    title: '¡Éxito!',
                    text: 'Usuario actualizado correctamente.',
                    icon: 'success',
                    confirmButtonText: 'Aceptar'
                }).then(() => {
                    window.location.href = 'index.html';
                });

            } catch (error) {
                let mensaje = "Error al actualizar el usuario.";
                if (error.response?.data?.detail) {
                    mensaje = error.response.data.detail;
                }
                Swal.fire('Error', mensaje, 'error');
            }
        }

        // Inicializar
        cargarUsuario();
    </script>
    <script src="theme.js"></script>
</body>

</html>
